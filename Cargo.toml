[package]
name = "servidor-https-rust"
version = "0.1.0"
edition = "2021"
authors = ["Francisco Sevilla", "Yeimar Gonzalez"]
description = "Servidor HTTPS multihilo en Rust con pool de hilos y rustls"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
num_cpus = "1"

[profile.release]
opt-level = 3
strip = true
